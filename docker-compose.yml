services:
  pipeline:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://kani:secret@db:5432/kanidata
    volumes:
      - ./data:/app/data

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kani
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kanidata
    ports:
      - "5432:5432"